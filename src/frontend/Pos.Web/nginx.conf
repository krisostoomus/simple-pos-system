server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Correct MIME for Blazor wasm/dll assets
    location /_framework/ {
        types { application/wasm wasm; application/octet-stream dll; }
        try_files $uri =404;
    }
}
