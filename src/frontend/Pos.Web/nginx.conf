server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor framework assets need correct MIME types
    location /_framework/ {
        types {
            application/wasm                                 wasm;
            application/octet-stream                         dll dat;
            application/javascript                           js mjs;
            text/css                                         css;
            application/json                                 json;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
